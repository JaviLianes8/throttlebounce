[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "throttlebounce"
version = "1.0.0"
description = "Typed, zero-dependency debounce and throttle decorators, sync and async, with lodash edge semantics and injectable time"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["debounce", "throttle", "decorator", "rate-limit", "timing", "asyncio", "lodash", "typed"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
throttlebounce = "throttlebounce._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/throttlebounce"
Documentation = "https://github.com/JaviLianes8/throttlebounce/blob/main/GUIDE.md"
Issues = "https://github.com/JaviLianes8/throttlebounce/issues"
Changelog = "https://github.com/JaviLianes8/throttlebounce/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/throttlebounce"]

[tool.hatch.build.targets.sdist]
include = [
    "src/throttlebounce",
    "tests",
    "scripts/fetch_oracles.py",
    "scripts/oracle_fixture.py",
    "README.md",
    "GUIDE.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "requirements-dev.txt",
]
exclude = ["__pycache__", "*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "-q --doctest-modules"
