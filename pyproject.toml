[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "throttlebounce"
version = "0.2.0"
description = "Small, typed, zero-dependency debounce and throttle decorators, sync and async, with injectable time"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["debounce", "throttle", "decorator", "rate-limit", "timing", "typed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.scripts]
throttlebounce = "throttlebounce._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/throttlebounce"
Issues = "https://github.com/JaviLianes8/throttlebounce/issues"
Changelog = "https://github.com/JaviLianes8/throttlebounce/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/throttlebounce"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "-q --doctest-modules"
